<tr id="item-row-{{ item.id }}">
    <td colspan="5">
        <form hx-post="{% url 'htmx_edit_invoice_item' item.id %}" hx-target="#invoice-items-container" class="p-2 border rounded bg-body-tertiary">
            {% csrf_token %}
            <div class="row g-2 align-items-end">
                <div class="col-12 col-sm-5">
                    <label class="form-label small fw-semibold">Descrição</label>
                    <textarea name="description" class="form-control form-control-sm" rows="2" required>{{ item.description }}</textarea>
                </div>
                <div class="col-6 col-sm-2">
                    <label class="form-label small fw-semibold">Quantidade</label>
                    <input type="number" step="0.01" min="0.01" name="quantity" class="form-control form-control-sm" value="{{ item.quantity|stringformat:'.2f' }}" required>
                </div>
                <div class="col-6 col-sm-3">
                    <label class="form-label small fw-semibold">Preço Unitário ({{ invoice.currency }})</label>
                    <input type="number" step="0.01" min="0.00" name="unit_price_foreign" class="form-control form-control-sm" value="{{ item.unit_price_foreign|stringformat:'.2f' }}" required>
                </div>
                <div class="col-12 col-sm-2 d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-primary flex-grow-1">Salvar</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" hx-get="{% url 'invoice_detail' invoice.id %}" hx-target="#invoice-items-container" hx-select="#invoice-items-container">Cancelar</button>
                </div>
            </div>
        </form>
    </td>
</tr>
