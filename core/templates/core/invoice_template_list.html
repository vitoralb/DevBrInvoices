{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Invoice Templates</h2>
</div>

<div class="row">
    <div class="col-md-12 mb-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Invoice Templates</h5>
                <a href="{% url 'invoice_template_create' %}" class="btn btn-sm btn-primary">Novo Invoice Template</a>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    {% for inv in invoice_templates %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ inv.name }}
                        <span>
                            <a href="{% url 'invoice_template_update' inv.pk %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <a href="{% url 'invoice_template_delete' inv.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                        </span>
                    </li>
                    {% empty %}
                    <li class="list-group-item text-muted">Nenhum template de invoice configurado.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
