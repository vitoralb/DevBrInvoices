<label for="id_exchange_rate" class="form-label text-muted small">Taxa de Câmbio ({{ currency }} para BRL)</label>
<input type="number" step="0.0001" id="id_exchange_rate" name="exchange_rate" class="form-control" required placeholder="ex. 3.6185" value="{% if rate %}{{ rate|stringformat:"s" }}{% endif %}">
