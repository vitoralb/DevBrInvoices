name: ${DEV_PROJECT_NAME:-notas-dev-8081}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notas}
      POSTGRES_USER: ${POSTGRES_USER:-notas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notas_dev_password_secret}
    volumes:
      - ${DEV_DATA_DIR:-./dev_data_8081}/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notas} -d ${POSTGRES_DB:-notas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ${DEV_IMAGE:-notas-dev:8081}
    build: .
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - ${DEV_DATA_DIR:-./dev_data_8081}/media:/app/media
    ports:
      - "${DEV_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - FORCE_DEBUG_MODE=True
      - DEBUG=True
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    image: ${DEV_IMAGE:-notas-dev:8081}
    build: .
    command: celery -A config worker -l INFO
    volumes:
      - ${DEV_DATA_DIR:-./dev_data_8081}/media:/app/media
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - FORCE_DEBUG_MODE=True
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    image: ${DEV_IMAGE:-notas-dev:8081}
    build: .
    command: celery -A config beat -l INFO -s /tmp/celerybeat-schedule
    volumes:
      - ${DEV_DATA_DIR:-./dev_data_8081}/media:/app/media
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - FORCE_DEBUG_MODE=True
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
